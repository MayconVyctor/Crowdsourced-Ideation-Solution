services:
  mongodb:
    image: mongo:7
    container_name: cis-api-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sd3_cisdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  liquibase:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - --search-path=/liquibase
      - --changelog-file=changelog/main.yaml
      - --url=mongodb://mongodb:27017/sd3_cisdb
      - update
